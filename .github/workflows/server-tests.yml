name: Server regressions

on:
  push:
    paths:
      - 'v5_server/**'
      - '.github/workflows/server-tests.yml'
  pull_request:
    paths:
      - 'v5_server/**'
      - '.github/workflows/server-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: v5_server/tests/requirements.txt
      - run: python -m pip install -r v5_server/tests/requirements.txt
      - run: python v5_server/run_tests.py --output test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-tests-python-${{ matrix.python }}
          path: test-results/
